<!doctype html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Apprends l’anglais avec 30 jeux, des niveaux et des pouvoirs."><title>English Quest — Apprends, joue, progresse</title><link rel="stylesheet" href="style.css"><script defer src="script.js"></script></head>
<body><aside><a class="brand" href="index.html">✦ ENGLISH <span>QUEST</span></a><p class="eyebrow">TON AVENTURE</p><nav aria-label="Navigation principale"><button data-view="quests">◈ Quêtes <small>30</small></button><button data-view="powers">✦ Mes pouvoirs</button><button data-view="groups">♧ Guildes</button><button data-view="profile">↗ Ma progression</button></nav><div class="aside-note">Chaque héros commence quelque part.<p>Avance à ton rythme. Chaque erreur aide à apprendre.</p></div></aside>
<main><header><span id="mode">Sauvegarde sur cet appareil</span><div><button id="account">Se connecter / Créer un compte</button><span id="stats"></span></div></header><div id="notice" role="status" aria-live="polite"></div><section id="content"></section><footer>English Quest · Une aventure pour tous les niveaux.</footer></main>
<dialog id="play" aria-labelledby="play-title"><button class="close" id="close-play" aria-label="Fermer la partie">×</button><div id="play-content"></div></dialog>
<dialog id="auth" aria-labelledby="auth-title"><button class="close" id="close-auth" aria-label="Fermer">×</button><h2 id="auth-title">Ton compte English Quest</h2><p>Enregistre ton aventure avec ton adresse mail.</p><div class="tabs"><button data-auth="login">Connexion</button><button data-auth="register">Inscription</button></div><form id="auth-form"><label id="name-label">Pseudo<input name="name" minlength="2" maxlength="24" autocomplete="nickname"></label><label>Adresse mail<input name="email" type="email" required autocomplete="email"></label><label>Mot de passe<input name="password" type="password" required minlength="12" maxlength="128" autocomplete="current-password"></label><label id="confirm-label">Confirmer le mot de passe<input name="confirmPassword" type="password" autocomplete="new-password"></label><button class="primary" type="submit">Continuer</button></form><p id="auth-status" role="status" aria-live="polite"></p></dialog></body></html>
